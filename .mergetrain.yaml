version: 2

project:
  name: dark-compiler

git:
  remote: mergetrain-local
  integration_branch: main
  push_refs:
    - main

gates:
  - name: benchmark-sources
    run: python3 benchmarks/check_sources_unchanged.py --base ${integration_ref}
  - name: build
    run: ./build --ai
  - name: tests
    run: ./run-tests --ai
  - name: benchmarks
    run: ./benchmarks/run_benchmarks.sh --verify-fresh full
