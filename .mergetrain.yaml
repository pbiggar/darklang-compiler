version: 2

project:
  name: dark-compiler

git:
  remote: mergetrain-local
  integration_branch: main
  push_refs:
    - main

gates:
  - name: e2e-temp-paths
    run: python3 scripts/check_e2e_temp_paths.py
  - name: benchmark-sources
    run: python3 ${repo}/scripts/mergetrain_exception.py --repo ${repo} gate benchmark-sources -- python3 benchmarks/check_sources_unchanged.py --base ${integration_ref}
  - name: build
    run: ./build --ai
  - name: tests
    run: ./run-tests --ai
  - name: leaks
    run: python3 ${repo}/scripts/mergetrain_exception.py --repo ${repo} gate leaks -- python3 scripts/check_compiled_leaks.py
  - name: benchmarks
    run: python3 ${repo}/scripts/mergetrain_exception.py --repo ${repo} gate benchmarks -- ./benchmarks/run_benchmarks.sh --verify-fresh full
