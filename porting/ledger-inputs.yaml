# Maintained decisions only. Generated facts belong in generated/ledger.json.
schema: 1
# Exceptional upstream test IDs -> {compiler: [existing test IDs], reason: ...}.
test_mappings: {}
features_file: porting/language-features.yaml
source_mappings:
  # Await shares a root module with unrelated functions, but has no implementation here.
  packages/darklang/stdlib/await.dark: []
  packages/darklang/stdlib/traits.dark: [StdLib/traits.dark]
  # Upstream nested modules are split into separate compiler source files.
  packages/darklang/stdlib/cli/host.dark:
    - StdLib/Cli/OS.dark
    - StdLib/Cli/Architecture.dark
    - StdLib/Cli/Shell.dark
    - StdLib/Cli/Host.dark
  packages/darklang/prettyPrinter/runtimeError.dark:
    - packages/Darklang/PrettyPrinter/RuntimeTypes.dark
    - packages/Darklang/PrettyPrinter/RuntimeTypes/RuntimeError.dark
parser_mappings:
  parser:backend/src/LibParser/Lexer.fs: [src/frontend/interpreter/Lexer.ml]
  parser:backend/src/LibParser/Tokenizer.fs: [src/frontend/interpreter/Tokenizer.ml]
  parser:backend/src/LibParser/Validation.fs: [src/frontend/interpreter/Validation.ml]
  parser:backend/src/LibParser/WrittenTypes.fs: [src/frontend/interpreter/WrittenTypes.ml]
  parser:backend/src/LibParser/Parser.fs:
    - src/frontend/interpreter/Parser.ml
    - src/frontend/interpreter/ParserSupport.ml
    - src/frontend/interpreter/FileParser.ml
    - src/frontend/interpreter/DeclarationParser.ml
    - src/frontend/interpreter/DeclarationSupport.ml
    - src/frontend/interpreter/BindingPatternParser.ml
    - src/frontend/interpreter/ExpressionCollections.ml
    - src/frontend/interpreter/ExpressionControl.ml
    - src/frontend/interpreter/ExpressionInterpolation.ml
    - src/frontend/interpreter/ExpressionPrecedence.ml
    - src/frontend/interpreter/ExpressionPrimary.ml
    - src/frontend/interpreter/TypeDefinitionParser.ml
    - src/frontend/interpreter/TypeParser.ml
    - src/frontend/interpreter/PatternParser.ml
  parser:backend/src/LibParser/SourceFile.fs: [src/frontend/WrittenSource.ml]
  parser:backend/src/LibParser/NameResolver.fs: [src/NameResolution.ml, src/frontend/checking/ResolveDeclarations.ml, src/frontend/WrittenTypeSupport.ml]
  parser:backend/src/LibParser/WrittenTypesToProgramTypes.fs: [src/frontend/WrittenChecking.ml, src/frontend/WrittenDeclarations.ml, src/frontend/WrittenExpressions.ml]
  parser:backend/src/LibParser/Package.fs: [src/packages/PackageManager.ml, src/driver/PackageCatalog.ml, src/frontend/NamedPackageTests.ml]
builtin_mappings:
  builtins:backend/src/Builtins/Builtins.Pure/Libs/Bool.fs#fn/boolNot/v0: [src/frontend/WrittenApplicationSupport.ml]
  builtins:backend/src/Builtins/Builtins.Pure/Libs/NoModule.fs#fn/unwrap/v0: [src/frontend/WrittenApplicationSupport.ml]
  builtins:backend/src/Builtins/Builtins.Pure/Libs/NoModule.fs#fn/negate/v0: [src/frontend/WrittenApplicationSupport.ml]
  builtins:backend/src/Builtins/Builtins.Pure/Libs/NoModule.fs#fn/bitwiseNot/v0: [src/frontend/WrittenApplicationSupport.ml]
