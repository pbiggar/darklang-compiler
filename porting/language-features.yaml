# Maintained language assessments; details belong in the compiler and test suite.
schema: 2
groups:
  Function calls:
    Builtin function calls: supported
    Immediate lambda application: supported
    Immediate curried lambda application: supported
    Named function overapplication:
      status: missing
      notes: Named calls require the declared arity; call a returned function in a separate application step.
    Package function calls: supported
    Direct positional calls: supported
    Qualified function calls: supported
    Local function-value calls: supported
    Higher-order arguments: supported
    Returned functions: supported
    Non-capturing lambdas: supported
    Capturing lambdas: supported
    Multiple lambda parameters: supported
    Lambda tuple parameters: supported
    Unit function parameters: supported
    Named function references: supported
    Partial application of named functions: supported
    Partial application of function values: supported
    Generic partial application with explicit types: supported
    Generic partial application using inference alone: supported
    Recursive functions: supported
    Mutually recursive functions: supported
    Local recursion: supported
    Polymorphic recursion:
      status: partial
      notes: Finite specialization supports concrete type resets and type-parameter permutations, including mutual calls and function values. Reachable constructor-growing type-flow cycles are rejected because native compilation would require infinitely many instances; the interpreter can execute terminating calls of this form.
    Too many call arguments: supported
    Call argument and return types: supported
