    Runtime trait lookup:
      status: excluded
      notes: Intentionally unsupported. Trait implementation selection finishes during compilation; runtime dispatch is outside the compiler's language model.
    Newest-implementation-wins dispatch:
      status: excluded
      notes: Intentionally unsupported. The compiler rejects ambiguous implementations; it does not select the newest implementation at runtime.
    Trait effect ceilings:
      status: missing
      notes: Trait method permission ceilings are not enforced by the static trait model.
