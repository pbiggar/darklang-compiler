  Effects:
    Effect names: supported
    Effect row annotations: supported
    Empty effect rows: supported
    Effect propagation through calls:
      status: missing
      notes: Called-function effects are not propagated through the direct checker.
    Function permission ceilings:
      status: missing
      notes: Declared effect ceilings are not enforced by the direct checker.
    Higher-order effect propagation:
      status: missing
      notes: Effects through function values lack full propagation/enforcement.
  Async:
    Future value representation:
      status: missing
      notes: The merged baseline does not represent futures in the native language pipeline.
    Implicit await on value use:
      status: missing
      notes: Future values are not resolved implicitly by this baseline. Upstream e76430be5 also carries pending
        reads inside containers and closure captures without waiting at construction.
    Async function calls:
      status: missing
      notes: Native future-producing function calls are not implemented in this baseline.
    Async failures:
      status: missing
      notes: Propagation of failures through futures is not implemented in this baseline.
    Explicit await forces a pending argument:
      status: missing
      notes: Upstream await calls Builtin.runtimeForce; user function calls may pass pending arguments onward. The
        separate native async implementation is not merged into this baseline.
  Early return:
    Postfix unwrap propagation:
      status: supported
      notes: Option/Result propagation is checked ahead of time and lowered to lexical exit joins. Failures return
        from the nearest function or lambda, including pipeline lambdas, while success and enclosing return payload
        types may differ. Result error types must match; Builtin.unwrap retains its separate raising behavior.
  Reflection and dynamic execution:
    Runtime expression evaluation:
      status: excluded
      notes: Intentionally unsupported. The compiler does not evaluate arbitrary source or AST at runtime.
    Runtime function lookup by name:
      status: excluded
      notes: Intentionally unsupported. The compiler does not provide general runtime lookup and invocation of program functions by string name.
    Runtime program reflection:
      status: excluded
      notes: Intentionally unsupported. The compiler does not expose a runtime program reflection model; its metadata is used during compilation.
  Test declarations:
    Named test declaration parsing: supported
    Named test extraction: supported
    Imported named-test fixtures: supported
    General named-package test adoption:
      status: partial
      notes: Not every upstream named test has an enabled compiler counterpart.
