# Syntax behavior, not parser implementation-file mappings.
# Scope: current source acceptance and written syntax against sources.yaml.
# AOT typing, resolution, execution and source-unit composition differences are
# explicitly out of bounds and are not parser compatibility issues. Unicode
# source handling/positions and runtime parser APIs are also outside this review.
# Assessments use source comparison and existing focused syntax evidence; they
# are not a claim of exhaustive differential execution.
# Reviewed 2026-10-21. Structural validation that is shared with parsing is in
# scope; later semantic checking is not. Specific gaps below qualify the
# surrounding supported grammar, rather than making those gaps disappear.
schema: 2
groups:
  Lexing:
    Comments: supported
    Identifiers and escaped identifiers: supported
    Numeric literals: supported
    Character literals: supported
    Quoted strings: supported
    Triple-quoted strings: supported
  Expressions:
    Function application and precedence: supported
    Pipelines: supported
    Collection literals: supported
    Conditionals: supported
    Match patterns and guards: supported
    String interpolation and nesting: supported
    Postfix unwrap:
      status: missing
      notes: The interpreter parses value?, (f x)? and chained postfix access. The compiler has no question-mark
        token or written unwrap node.
    Numeric tuple selectors:
      status: missing
      notes: The interpreter parses tuple.1 and splits tuple.1.2 into chained selectors. The compiler accepts
        only identifier field names after a dot.
    Rejection of legacy concatenation operators:
      status: missing
      notes: The interpreter rejects ++ in favor of +. The compiler still accepts infix ++, the (++) operator
        section and pipeline operator sections.
    Record and dictionary separators:
      status: supported
      notes: Records, record updates, record types and dictionaries use commas or newlines. Semicolons are rejected;
        statement sequencing retains semicolons.
  Declarations:
    Modules and nesting: supported
    Function and value declarations: supported
    Records and enums: supported
    Traits and implementations: supported
    Generic parameters and bounds: supported
    Function types after nested generic closers:
      status: missing
      notes: A pending > from a split >> does not stop the compiler's function-type parser. It reads
        List<List<Int>> -> Int as List<(List<Int> -> Int)> instead of a function from List<List<Int>> to Int.
        The same defect can absorb an arrow inside a function's return type. Tuple-type parsing already
        respects pending closers; function-type parsing in the interpreter does too.
    Trait method parameter validation:
      status: partial
      notes: The interpreter rejects blank ___ parameters in trait signatures; the compiler accepts them.
        Conversely, the compiler's structural validator rejects duplicate usable parameter names within a
        trait signature, while the interpreter's parser validator does not check those names. Ordinary
        function declarations reject blank parameters and duplicate usable names on both sides.
    Trait method name uniqueness:
      status: missing
      notes: The interpreter's parser validator rejects repeated usable method names in a trait. The compiler
        checks each signature's parameter names instead and accepts repeated method names at this boundary.
        Any later name or type checking is outside this parser assessment.
    Implementation member name uniqueness:
      status: missing
      notes: The interpreter's parser validator rejects repeated usable impl member names, including aliases,
        with VALIDATION-IMPL-METHODS. The compiler only validates individual method functions at this boundary.
        Any later name or type checking is outside this parser assessment.
    Effect annotations:
      status: partial
      notes: Function and trait method effect rows parse, but Concurrency and Runtime are absent from the compiler's
        recognized names. Effect enforcement is an AOT concern outside this syntax assessment.
    Enum case capitalization:
      status: partial
      notes: The compiler treats names beginning with __ followed by an uppercase letter as uppercase in enum
        declarations and match patterns; the interpreter requires an uppercase first character. This affects
        compiler-private spellings such as __Case; public visibility checking is separate.
    Database attributes:
      status: supported
      notes: Both reject [<DB>] declarations.
  Tests:
    Named test declarations: supported
    Rejection of SQL-error assertion markers:
      status: missing
      notes: The compiler still recognizes sqlerror="message" and sqlerror "message" as special expected outcomes.
        The interpreter only recognizes error markers and otherwise parses an ordinary expected expression.
  Limits:
    Parser nesting limit:
      status: partial
      notes: The compiler's parser-depth cap is 512 and the interpreter's is 200. Both retain a separate interpolation
        nesting cap of 64. The interpreter additionally checks available stack space and returns a structured
        depth failure; the compiler has no equivalent guard at parser entry points.
