# Current syntax and structural validation against sources.yaml.
# AOT checking/execution/composition, Unicode-source concerns and runtime parser APIs
# are outside this assessment. Supported is scoped source parity plus focused native
# regressions, not exhaustive execution of an interpreter differential corpus.
schema: 2
groups:
  Lexing:
    Comments: supported
    Identifiers and escaped identifiers: supported
    Numeric literals: supported
    Character literals: supported
    Quoted strings: supported
    Triple-quoted strings: supported
  Expressions:
    Function application and precedence: supported
    Pipelines: supported
    Collection literals: supported
    Conditionals: supported
    Match patterns and guards: supported
    String interpolation and nesting: supported
    Postfix unwrap: supported
    Numeric tuple selectors: supported
    Rejection of legacy concatenation operators: supported
    Record and dictionary separators: supported
  Declarations:
    Modules and nesting: supported
    Function and value declarations: supported
    Records and enums: supported
    Traits and implementations: supported
    Generic parameters and bounds: supported
    Function types after nested generic closers: supported
    Trait method parameter validation: supported
    Trait method name uniqueness: supported
    Implementation member name uniqueness: supported
    Effect annotations: supported
    Enum case capitalization: supported
    Database attributes: supported
  Tests:
    Named test declarations: supported
    Rejection of SQL-error assertion markers: supported
  Limits:
    Parser nesting limit: supported
